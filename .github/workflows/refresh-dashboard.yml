name: Atualizar dados do Painel Quero Pago

on:
  schedule:
    # 10:30 UTC = 07:30 America/Sao_Paulo (Brasil nao observa horario de verao)
    - cron: "30 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar CSV da aba sem_painel
        run: |
          curl -sL --fail "https://docs.google.com/spreadsheets/d/175ofeL64-b0G7hlYKqIBkmyN7aYisozAV72v_qykTAM/export?format=csv" -o sheet.csv
          test -s sheet.csv

      - name: Baixar CSV da aba aptos_rematricula
        run: |
          curl -sL --fail "https://docs.google.com/spreadsheets/d/175ofeL64-b0G7hlYKqIBkmyN7aYisozAV72v_qykTAM/gviz/tq?tqx=out:csv&sheet=aptos_rematricula" -o aptos.csv
          test -s aptos.csv

      - name: Parsear CSVs
        run: |
          node 1-parse.cjs sheet.csv parsed-sem-painel.json
          node 1-parse.cjs aptos.csv parsed-aptos.json

      - name: Agregar dados (sem PII)
        run: |
          node 2a-aggregate-sem-painel.cjs parsed-sem-painel.json agg-sem-painel.json
          node 2b-aggregate-aptos-rematricula.cjs parsed-aptos.json agg-aptos.json

      - name: Checar sanity minimo (rowCount valido nos dois datasets)
        run: |
          node -e "
            const a = require('./agg-sem-painel.json');
            const b = require('./agg-aptos.json');
            if (!a.meta || !(a.meta.rowCount > 0)) { console.error('sem_painel rowCount invalido:', a.meta && a.meta.rowCount); process.exit(1); }
            if (!b.meta || !(b.meta.rowCount >= 0)) { console.error('aptos_rematricula rowCount invalido:', b.meta && b.meta.rowCount); process.exit(1); }
            console.log('OK sem_painel=' + a.meta.rowCount + ' aptos_rematricula=' + b.meta.rowCount);
          "

      - name: Injetar dados no HTML
        run: |
          node 3-inject.cjs painel-quero-pago.html agg-sem-painel.json dash-data-sem-painel
          node 3-inject.cjs painel-quero-pago.html agg-aptos.json dash-data-aptos-rematricula

      - name: Commitar e enviar, se houve mudanca
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- painel-quero-pago.html; then
            echo "Sem mudanca nos dados, nada a commitar."
          else
            git add painel-quero-pago.html
            git commit -m "chore: atualiza dados do painel ($(date -u +%F))"
            git push
          fi
